<!DOCTYPE html>
<html lang="en">
<head>
    <title>Blog System</title>
 
    <h1>Register for Blog System</h1>
    <form action="../control/register.php" method="post">
        <label for="author_name">Author Name:</label><br>
        <input type="text" id="author_name" name="author_name" placeholder="Author Name" required><br><br>

        <label for="contact_no">Contact Number:</label><br>
        <input type="text" id="contact_no" name="contact_no" placeholder="Contact Number" required><br><br>

        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" placeholder="Username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Password" required><br><br>

        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="login.html">Login here</a>.</p>
</body>
</html>
